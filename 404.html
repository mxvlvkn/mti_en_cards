<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Wordly</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f4ee;
      color: #1c1a16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121417; color: #ece9e2; }
      p { color: #969188; }
      a { background: #46b795; color: #0b1f19; }
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 16px;
      background: linear-gradient(145deg, #2a9d80, #135c4a);
      color: #fff; font: 700 26px Georgia, serif;
    }
    h1 { margin: 0 0 8px; font: 600 26px Georgia, serif; letter-spacing: -0.01em; }
    p { margin: 0 auto 22px; max-width: 40ch; color: #79736a; font-size: 14px; line-height: 1.55; }
    a {
      display: inline-flex; align-items: center; height: 44px; padding: 0 22px;
      border-radius: 999px; background: #1d7a62; color: #fff;
      text-decoration: none; font-size: 14px; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">W</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь к карточкам — там всё на месте.</p>
    <a href="./">На главную</a>
  </main>
</body>
</html>
