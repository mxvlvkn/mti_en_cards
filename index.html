<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MTIEN — английский по карточкам</title>
  <meta name="description" content="Тренажёр английских слов: карточки, интервальные повторения и короткие тесты. Работает офлайн, синхронизируется с Supabase.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Тема применяется до отрисовки, чтобы не было вспышки светлого фона.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('wordly.v1') || '{}');
        var theme = saved && saved.settings && saved.settings.theme;
        var dark = theme === 'dark' || (!theme || theme === 'auto') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) { /* локальное хранилище недоступно — остаёмся на светлой */ }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Перейти к содержимому</a>

  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.6 12 3l9 7.6"/><path d="M5.5 9.2V21h13V9.2"/><path d="M9.8 21v-6.4h4.4V21"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.2 2.5 5 13.4h5.6L10.2 21.5 19 10.2h-5.7z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V11"/><path d="M10 20V4"/><path d="M16 20v-6"/><path d="M22 20H2"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c3.2 3.8 5 6.2 5 9.1a5 5 0 0 1-10 0c0-1.9.8-3.6 2.4-5.4.1 1.9.9 3 2.1 3.4C11.3 8 11.5 5.6 12 3z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6.5-10.5 11L4 12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 19-7-7 7-7"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.9A9 9 0 1 1 11.1 3a7 7 0 0 0 9.9 9.9z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M4 3h16"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.5 12h15"/><path d="m13 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 14 9l5.5 2-5.5 2-2 5.5-2-5.5L4.5 11 10 9z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h5v16h-5"/><path d="M3 12h11"/><path d="m10 8 4 4-4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.8v.2"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Боковая панель">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span class="brand-text"><strong>MTIEN</strong><small>English cards</small></span>
      </a>

      <nav class="nav" aria-label="Основная навигация">
        <a class="nav-link" href="#/" data-nav="home">
          <svg aria-hidden="true"><use href="#i-home"/></svg><span>Главная</span>
        </a>
        <a class="nav-link" href="#/quiz" data-nav="quiz">
          <svg aria-hidden="true"><use href="#i-bolt"/></svg><span>Тест</span>
        </a>
        <a class="nav-link" href="#/stats" data-nav="stats">
          <svg aria-hidden="true"><use href="#i-chart"/></svg><span>Прогресс</span>
        </a>
        <a class="nav-link" href="#/settings" data-nav="settings">
          <svg aria-hidden="true"><use href="#i-cog"/></svg><span>Настройки</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="streak-card">
          <span class="streak-flame"><svg aria-hidden="true"><use href="#i-flame"/></svg></span>
          <div>
            <strong data-streak>0</strong>
            <small data-streak-label>серия дней</small>
          </div>
        </div>
        <button class="account" type="button" data-account>
          <span class="avatar" data-avatar>Г</span>
          <span class="account-text">
            <strong data-user-name>Гость</strong>
            <small data-user-state>локальный режим</small>
          </span>
          <svg class="account-chev" aria-hidden="true"><use href="#i-arrow"/></svg>
        </button>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <a class="brand brand--compact" href="#/">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-text"><strong>MTIEN</strong></span>
        </a>
        <div class="topbar-actions">
          <span class="streak-pill" title="Серия дней">
            <svg aria-hidden="true"><use href="#i-flame"/></svg><span data-streak>0</span>
          </span>
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Переключить тему">
            <svg aria-hidden="true"><use href="#i-sun"/></svg>
          </button>
          <button class="avatar" type="button" data-account aria-label="Аккаунт"><span data-avatar>Г</span></button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" aria-label="Навигация">
      <a class="tab" href="#/" data-nav="home"><svg aria-hidden="true"><use href="#i-home"/></svg><span>Главная</span></a>
      <a class="tab" href="#/quiz" data-nav="quiz"><svg aria-hidden="true"><use href="#i-bolt"/></svg><span>Тест</span></a>
      <a class="tab" href="#/stats" data-nav="stats"><svg aria-hidden="true"><use href="#i-chart"/></svg><span>Прогресс</span></a>
      <a class="tab" href="#/settings" data-nav="settings"><svg aria-hidden="true"><use href="#i-cog"/></svg><span>Настройки</span></a>
    </nav>
  </div>

  <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
